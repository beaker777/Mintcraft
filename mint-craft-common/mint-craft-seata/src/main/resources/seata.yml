seata:
  application-id: MintCraft
  tx-service-group: default_tx_group
  #  use-jdk-proxy: true
  #  enable-auto-data-source-proxy: false
  config:
    type: nacos
    nacos:
      server-addr: ${mintcraft.nacos.server.url}
      group: ${mintcraft.seata.nacos.group}
      data-id: ${mintcraft.seata.nacos.data-id}
      namespace: ${mintcraft.seata.nacos.namespace}
  registry:
    type: nacos
    nacos:
      application: seata-server
      server-addr: ${mintcraft.nacos.server.url}
      group: ${mintcraft.seata.nacos.group}
      cluster: default
      namespace: ${mintcraft.seata.nacos.namespace}